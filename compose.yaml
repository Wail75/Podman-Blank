services:

  postgresql:
    container_name: postgresql
    image: docker.io/postgres:16-alpine
    restart: always
    ports:
      5433:5432
    environment:
      POSTGRES_USER: devpg
      POSTGRES_PASSWORD: devpg
      POSTGRES_DB: website
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 3

  website:
    container_name: website
    depends_on:
      postgresql:
        condition: service_healthy
    build:
      context: website
      containerfile: Containerfile
    restart: always
    ports:
      2000:2000
    volumes:
      - ./tls:/home/webdev/tls
    healthcheck:
      # you may have to replace localhost with the domain name
      test: ['CMD', '/usr/bin/curl https://localhost:2000']
      interval: 60s
      timeout: 3s
      retries: 1

volumes:
  pg-data:
